<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch: see what your AI agent is doing</title>
<meta name="description" content="A Mac app for Claude Code, Codex and OpenCode: follow each step on the right, see changes by turn, and get a short note whenever the agent makes something new. Free and open source.">
<meta property="og:title" content="Dispatch: see what your AI agent is doing">
<meta property="og:description" content="A Mac app for Claude Code, Codex and OpenCode. Follow each step, learn while it works.">
<meta property="og:image" content="https://dispatch.us-cloud.uk/assets/icon.png">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
/* ===== tokens: DESIGN.md stone, light and dark ===== */
:root {
  color-scheme: light;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --page: #fafaf9; --bg: #ffffff; --bg-2: #fafaf9; --shell: #f5f5f4; --sel: #f2f1f0; --chip: #f2f1f0; --chip-2: #f5f5f4;
  --text: #0c0a09; --text-2: #79716b; --hair: #e7e5e4; --hair-2: #e7e5e4;
  --fill: #252525; --fill-text: #fafaf9; --ring: rgba(37,37,37,.3);
  --pop: 0 1px 2px rgba(0,0,0,.04), 0 10px 28px -8px rgba(0,0,0,.14);
  --working: #2e8b57; --waiting: #b88100; --done: #2f6f73; --stopped: #c9683f; --plan: #6e56cf; --handoff: #1d5fd1;
  --i-gray: #8a857c; --i-amber: #c28a12; --i-green: #2e8b57; --i-blue: #1d5fd1; --i-cream: #d1d1cd; --i-coral: #c9683f; --i-teal: #2f6f73; --i-purple: #6e56cf; --i-cream-dot: #f4f3ef;
  --code-str: #a8552f; --code-key: #6e56cf; --code-com: #79716b;
  --ease-out: cubic-bezier(0, 0, 0.2, 1); --ease-std: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: linear(0, 0.26, 0.6, 0.86, 1.02, 1.08, 1.07, 1.03, 1, 0.99, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0c0a09; --bg: #151311; --bg-2: #1c1917; --shell: #0c0a09; --sel: #292524; --chip: #292524; --chip-2: rgba(255,255,255,.045);
  --text: #fafaf9; --text-2: #a6a09b; --hair: rgba(255,255,255,.1); --hair-2: rgba(255,255,255,.15);
  --fill: #fafaf9; --fill-text: #0c0a09; --ring: rgba(250,250,249,.3);
  --pop: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -8px rgba(0,0,0,.6);
  --done: #3a797d; --handoff: #286add; --plan: #725bd4;
  --i-cream: #f4f3ef;
  --code-str: #e08a62; --code-key: #a08cff; --code-com: #8a857c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; text-autospace: normal; font-kerning: normal; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico.f { fill: currentColor; stroke: none; }
.wrap { width: min(1160px, calc(100% - 64px)); margin: 0 auto; }

/* ===== site chrome, same skeleton as apps.us-cloud.uk ===== */
.nav { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(16px); }
.nav .in { height: 56px; display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.brand img { width: 22px; height: 22px; border-radius: 5px; }
.nav .by { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.nav .by:hover { color: var(--text); }
.nav .sp { flex: 1; }
.nav .gh { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.nav .gh:hover { color: var(--text); }
.seg { display: flex; padding: 2px; border-radius: 999px; border: 1px solid var(--hair-2); background: var(--bg); }
.seg button { border: 0; background: none; padding: 2px 10px; border-radius: 999px; font-size: 12px; color: var(--text-2); cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--text); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid var(--hair-2); background: var(--bg); white-space: nowrap; transition: background-color .15s; }
.pill:hover { background: var(--sel); }
.pill:active { transform: translateY(1px); }
.pill.solid { background: var(--fill); color: var(--fill-text); border-color: var(--fill); }
.pill.solid:hover { opacity: .9; }
.pill.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.pill .ico { width: 16px; height: 16px; }
.fine { font-size: 12px; color: var(--text-2); line-height: 1.6; }
.fine b { color: var(--text); font-weight: 500; }
.fine a { text-decoration: underline; text-decoration-color: var(--hair-2); text-underline-offset: 3px; }
.fine a:hover { color: var(--text); text-decoration-color: currentColor; }
.kicker { font-size: 13px; color: var(--text-2); }
h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: 0; text-wrap: balance; }

/* facts: three things that do not change */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.facts > div { display: grid; grid-template-columns: 24px 1fr; gap: 0 12px; align-content: start; }
.facts .ico { width: 20px; height: 20px; color: var(--text-2); margin-top: 2px; grid-row: span 2; }
.facts b { font-size: 14px; font-weight: 600; }
.facts span { font-size: 13px; color: var(--text-2); line-height: 1.6; }

/* footer: the hub's strip, Dispatch marked as here */
.foot { border-top: 1px solid var(--hair); margin-top: 64px; padding: 20px 0 32px; }
.xstrip { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; font-size: 13px; color: var(--text-2); }
.xstrip .by b { font-weight: 600; color: var(--text); }
.xstrip .by u { text-underline-offset: 3px; text-decoration-color: var(--hair-2); }
.xstrip .by:hover u { text-decoration-color: currentColor; color: var(--text); }
.xstrip .icons { display: flex; gap: 8px; }
.xstrip .icons a { position: relative; display: block; width: 22px; height: 22px; }
.xstrip .icons img { width: 22px; height: 22px; border-radius: 5px; box-shadow: 0 0 0 1px var(--hair); transition: transform .15s; }
.xstrip .icons a:hover img { transform: translateY(-1px); }
.xstrip .icons a.cur::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--text-2); }
.xstrip .icons .tip { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.xstrip .icons a:hover .tip { opacity: 1; }
.foot .row { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--text-2); }

/* ===== the Dispatch window, rebuilt (real values from DESIGN.md) ===== */
.winbox { position: relative; }
.win { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1180px; height: 700px; display: grid; grid-template-rows: 40px 1fr 28px; background: var(--shell); border: 1px solid var(--hair-2); border-radius: 12px; overflow: hidden; font-size: 13px; line-height: 1.5; box-shadow: var(--pop); }
.win .tb { display: flex; align-items: center; gap: 12px; padding: 0 12px; color: var(--text-2); }
.win .lights { display: flex; gap: 8px; margin-right: 8px; }
.win .lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--hair-2); }
.win .tb .mid { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); min-width: 0; }
.win .tb .mid b { font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win .tb .r { display: flex; gap: 14px; }
.win .body { display: grid; grid-template-columns: 220px minmax(0, 1fr) 400px; gap: 6px; padding: 0 6px 0 0; min-height: 0; }
.win .bar { display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 12px; color: var(--text-2); }
.win .bar .sp { flex: 1; }
.win .bar .q { display: flex; align-items: center; gap: 6px; }
.win .bar .cells { display: flex; gap: 2px; }
.win .bar .cells i { width: 5px; height: 12px; border-radius: 1.6px; border: 1px solid color-mix(in srgb, var(--text-2) 45%, transparent); }
.win .bar .cells i.on { background: var(--text-2); border-color: var(--text-2); }

/* sidebar */
.side { padding: 4px 8px 12px; overflow: hidden; }
.side .hd { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 6px; }
.side .hd b { font-weight: 600; font-size: 13px; }
.side .hd .new { margin-left: auto; height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--hair-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.side .hd .new kbd { font: 11px var(--sans); color: var(--text-2); }
.lrow { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 20px; color: var(--text); white-space: nowrap; transition: background-color .15s; }
.lrow.ent { height: 36px; }
.lrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lrow .tm { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.lrow.sel { background: var(--sel); }
.lrow.in1 { padding-left: 28px; }
.lrow .ico { color: var(--text-2); }
.slot14 { width: 14px; height: 14px; flex: none; display: grid; place-items: center; position: relative; }
.grp { height: 8px; }

/* marks: VS Code's round state icons */
.mk { width: 14px; height: 14px; flex: none; display: block; }
.mk.m-now { color: var(--working); } .mk.m-wait { color: var(--waiting); } .mk.m-done { color: var(--done); } .mk.m-grey { color: var(--text-2); } .mk.m-sub { color: var(--plan); }
.mk.breath { animation: breath 2s ease-in-out infinite; }
@keyframes breath { 50% { opacity: .8; } }

/* the running blocks (the icon's ten, falling) */
svg.drop { overflow: visible; display: block; }
.dropclip { width: 16px; height: 14px; overflow: hidden; display: grid; align-items: end; justify-items: center; margin-top: -2px; padding-top: 0; }

/* chat column */
.chat { position: relative; background: var(--bg); border: 1px solid var(--hair); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.chat .flow { flex: 1; min-height: 0; overflow: hidden; padding: 24px 28px 8px; display: flex; flex-direction: column; gap: 4px; }
.bub { align-self: flex-end; max-width: 80%; padding: 12px 16px; border-radius: 24px; background: var(--chip); font-size: 14px; line-height: 1.55; }
:root[data-theme="dark"] .bub { background: rgba(250,250,249,.06); }
.say { font-size: 14px; line-height: 1.7; margin-top: 16px; }
.tool { display: flex; align-items: center; gap: 8px; height: 28px; font-size: 12px; color: var(--text-2); }
.tool .v { font-weight: 500; }
.tool .a { font-family: var(--mono); font-size: 12px; color: color-mix(in srgb, var(--text-2) 75%, transparent); }
.tool .ico { width: 14px; height: 14px; }
.tool .plus { color: var(--working); } .tool .minus { color: var(--stopped); }
.did { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-top: 16px; height: 24px; }
.files { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-top: 8px; }
.shim { background: linear-gradient(90deg, var(--text-2) 0%, var(--text-2) 40%, var(--text) 50%, var(--text-2) 60%, var(--text-2) 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shim 2s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }
.comp { margin: 0 28px 8px; border: 1px solid var(--hair-2); border-radius: 24px; background: var(--chip-2); padding: 14px 16px 10px; }
.comp .ta { min-height: 24px; font-size: 14px; color: var(--text); }
.comp .ta.ph { color: var(--text-2); }
.comp .ta .caret { display: inline-block; width: 1.5px; height: 1.05em; vertical-align: -.15em; background: var(--text); margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.comp .tools { display: flex; align-items: center; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--text-2); }
.comp .tools span { display: flex; align-items: center; gap: 6px; }
.comp .send { margin-left: auto; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--text) 12%, transparent); color: var(--text-2); transition: background-color .15s; }
.comp .send.on { background: var(--fill); color: var(--fill-text); }
.comp .send.stop i { width: 10px; height: 10px; border-radius: 3px; background: var(--text-2); animation: breath 2.4s ease-in-out infinite; }
.cstat { display: flex; justify-content: space-between; margin: 0 40px 12px; font-size: 12px; color: var(--text-2); }
.cstat span { display: flex; align-items: center; gap: 6px; }
.cstat .ico { width: 14px; height: 14px; }

/* right panel */
.rp { position: relative; background: var(--bg); border: 1px solid var(--hair); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tabs { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px; border-bottom: 1px solid color-mix(in srgb, var(--hair) 40%, transparent); flex: none; }
.tabs span { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.tabs span.on { background: var(--sel); color: var(--text); }
.tabs .ico { width: 14px; height: 14px; }
.now { padding: 8px 20px 0; }
.now .st { display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12px; color: var(--text-2); }
.now h4 { margin: 4px 0 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
.now .rn { margin-top: 2px; font-size: 12px; color: var(--text-2); height: 18px; }
.now .btns { display: flex; gap: 8px; margin-top: 12px; }
.now .btns span { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hair-2); }
.now .btns span.g { border-color: transparent; color: var(--text-2); }
.task { margin-top: 24px; }
.task .th { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 0 0 0; }
.task .th b { font-weight: 500; flex: 1; }
.task .th .n { font-size: 11px; color: var(--text-2); }
.task .th .ico { width: 12px; height: 12px; color: var(--text-2); }
.steps { position: relative; margin-left: 0; }
.steps::before { content: ""; position: absolute; left: 6.5px; top: 9px; bottom: 9px; width: 1px; background: var(--hair); }
.step { position: relative; display: flex; align-items: center; gap: 8px; height: 28px; color: var(--text-2); }
.step .mk { background: var(--bg); box-shadow: 0 0 0 2px var(--bg); border-radius: 50%; }
.step.cur { color: var(--text); font-weight: 500; }
.step.dn { color: var(--text-2); }
.deliv { display: flex; align-items: center; gap: 8px; height: 28px; font-size: 13px; }
.deliv .ico { width: 14px; height: 14px; color: var(--text-2); }
.deliv .tm { margin-left: auto; font-size: 11px; color: var(--text-2); }
.fold { display: flex; align-items: center; gap: 8px; height: 28px; margin-top: 24px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--text-2) 70%, transparent); }
.fold .ico { width: 12px; height: 12px; }
.fold .n { margin-left: auto; font-weight: 400; font-size: 11px; }

/* editor (Walk me through) */
.ed { position: absolute; inset: 41px 0 0 0; background: var(--bg); font: 12.5px/20px var(--mono); padding: 8px 0; opacity: 0; transition: opacity .2s var(--ease-out); pointer-events: none; }
.ed.on { opacity: 1; }
.ed .crumb { font: 12px var(--sans); color: var(--text-2); padding: 0 16px 8px; display: flex; gap: 6px; align-items: center; }
/* a block line, not flex: a flex line drops the whitespace-only text between the code's spans (its indents and spaces) */
.ed .ln { display: block; padding-right: 12px; white-space: pre; transition: background-color .2s var(--ease-out); }
.ed .ln i { display: inline-block; font-style: normal; width: 40px; text-align: right; padding-right: 14px; color: color-mix(in srgb, var(--text-2) 70%, transparent); }
.win.narrow .ed { font-size: 11px; line-height: 18px; }
.ed .ln.hi { background: color-mix(in srgb, var(--text) 7%, transparent); box-shadow: inset 2px 0 0 var(--text-2); }
.ed .s { color: var(--code-str); } .ed .k { color: var(--code-key); } .ed .c { color: var(--code-com); }

/* bottom-right cards: Talk cards, Walk me through */
.corner { position: absolute; right: 16px; bottom: 16px; width: 340px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.card { width: 100%; background: var(--bg); border: 1px solid var(--hair-2); border-radius: 12px; box-shadow: var(--pop); opacity: 0; transform: translateY(8px); transition: opacity .2s var(--ease-out), transform .2s var(--ease-out); }
:root[data-theme="dark"] .card { background: var(--bg-2); }
.card.on { opacity: 1; transform: none; }
/* a card not showing takes no room, so the ones showing sit in the corner (it still fades in and out where it is) */
.corner .card:not(.on) { position: absolute; right: 0; bottom: 0; }
.talk { padding: 10px 12px 10px 14px; }
.talk .r1 { display: flex; align-items: center; gap: 8px; height: 20px; }
.talk .r1 .ico { width: 14px; height: 14px; color: var(--text-2); }
.talk .r1 b { font-weight: 500; }
.talk .r1 small { font-size: 11px; color: var(--text-2); }
.talk .r1 .x { margin-left: auto; }
.talk p { margin: 2px 0 8px 22px; font-size: 13px; line-height: 1.55; color: var(--text-2); }
.talk .tl { height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--text-2) 18%, transparent); overflow: hidden; margin-left: 22px; }
.talk .tl i { display: block; height: 100%; width: 0; background: color-mix(in srgb, var(--text-2) 55%, transparent); }
.talk.on .tl i { animation: tl 7s linear forwards; }
@keyframes tl { to { width: 100%; } }
.wpill { width: auto; height: 32px; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; }
.wpill b { font-weight: 500; }
.wpill small { font-size: 12px; color: var(--text-2); }
.wpill .ico { width: 14px; height: 14px; color: var(--text-2); }
.stop .hd { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-bottom: 1px solid color-mix(in srgb, var(--hair) 40%, transparent); }
.stop .hd b { font-weight: 500; }
.stop .hd small { font-size: 12px; color: var(--text-2); }
.stop .hd .x { margin-left: auto; color: var(--text-2); }
.stop .bd { padding: 12px 12px 8px; }
.stop .f { display: flex; align-items: center; gap: 8px; }
.stop .f b { font-weight: 500; }
.stop .f small { font-size: 12px; color: var(--text-2); }
.stop .f .ico { width: 14px; height: 14px; color: var(--text-2); }
.stop p { margin: 6px 0 10px; font-size: 14px; line-height: 1.7; }
.stop .ask { display: inline-flex; height: 24px; align-items: center; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--chip); }
.stop .ft { display: flex; align-items: center; gap: 8px; padding: 8px 12px 12px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.stop .ft .b { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; }
.stop .ft .b.next { background: var(--fill); color: var(--fill-text); margin-left: auto; }
.stop .ft .b.back { color: var(--text-2); }

/* sub-agent strip */
.strip { margin: 0 28px 8px; background: var(--bg-2); border-radius: 16px; padding: 4px; font-size: 12px; color: var(--text-2); }
:root[data-theme="dark"] .strip { background: var(--chip); }
.strip .h { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; }
.strip .h b { font-weight: 600; }
.strip .s { padding: 3px 8px 5px; }
.strip .s .a { display: flex; align-items: center; gap: 8px; height: 26px; }
.strip .s .a b { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
.strip .s .a small, .strip .s .b small { font-size: 11px; font-variant-numeric: tabular-nums; }
.strip .s .b { display: flex; gap: 8px; height: 20px; padding-left: 22px; }
.strip .s .b span { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  .shim, .mk.breath, .comp .ta .caret, .talk.on .tl i, .comp .send.stop i { animation: none; }
  .shim { color: var(--text-2) !important; background: none; }
  .card, .ed { transition: none; }
}

/* ===== direction A: one live window ===== */

async function play(i, byUser) {
  CUR = i; if (byUser) PICKED = true;
  const g = ++GEN, sc = SCENES[i];
  [...rail.children].forEach((b, k) => { b.classList.toggle("on", k === i); b.setAttribute("aria-selected", k === i); const bar = b.querySelector(".b i"); bar.style.width = k < i ? "100%" : "0"; bar.style.opacity = k < i ? ".3" : "1"; });
  document.getElementById("railnote").textContent = t(sc.k + "d");
  WIN.reset(sc.base);
  const bar = rail.children[i].querySelector(".b i");
  const total = { 0: 5500, 1: 5400, 2: 8000, 3: 15500 }[i]; let spent = 0;
  const W = async (ms) => { let left = ms; while (left > 0) { await sleep(50); if (g !== GEN) throw 0; if (!HOVER) { left -= 50; spent += 50; bar.style.width = Math.min(100, spent / total * 100) + "%"; } } };
  if (REDUCED) { endState(i); bar.style.width = "100%"; return; }
  try { await sc.play(WIN, W); bar.style.width = "100%"; await W(1600); } catch (e) { return; }
  if (!PICKED) play((i + 1) % SCENES.length);
}
function endState(i) {
  WIN.reset([{ bubble: true, tools: 1, toolRun: true, row: "run", now: "work", step: 0 }, { bubble: true, tools: 2, toolRun: true, row: "run", now: "work", step: 1, mins: "1 min" }, { bubble: true, tools: 4, row: "run", now: "work", step: 2, mins: "2 min", talk: [true, true] }, { bubble: true, tools: 5, row: "done", now: "done", say: true, stop: 0 }][i]);
}
rail.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) play(+b.dataset.go, true); });
box.addEventListener("mouseenter", () => { HOVER = true; }); box.addEventListener("mouseleave", () => { HOVER = false; });
new ResizeObserver(() => { if (mountWindow()) play(CUR, PICKED); }).observe(box);

function render() {
  applyText(); railHTML();
  document.querySelectorAll(".ghi").forEach(e => e.innerHTML = GITHUB);
  document.querySelectorAll(".apl").forEach(e => e.innerHTML = APPLE);
  document.querySelectorAll(".fi").forEach(e => e.outerHTML = ic(e.dataset.ic));
  document.querySelector(".appsi").innerHTML = ic("apps");
  if (/^https?:$/.test(location.protocol)) document.getElementById("host").textContent = location.host + location.pathname.replace(/index\.html$/, "").replace(/\/$/, "");
  setDownloads();
  document.getElementById("strip").innerHTML = stripHTML();
}
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; LANG = b.dataset.lang; try { localStorage.setItem("dispatch.lang", LANG); } catch (er) {} render(); play(CUR, PICKED); });
render(); mountWindow(); latest();
const at = location.hash.match(/scene=(\d)/); play(at ? +at[1] - 1 : 0, !!at);
</script>
