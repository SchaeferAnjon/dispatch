name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    # The bundled CLI must run on the Python a fresh Mac has (3.9 from the Command Line Tools).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Every CLI module compiles on this Python
        run: python -m py_compile app/cli/*.py
      # Compiling is not running: Python 3.9 reads a *script* through a different decoder, which once
      # rejected a long non-ASCII line that py_compile and import accepted. The app, the hooks and the
      # phone service all run these files as scripts.
      - name: The entry points run as scripts
        run: |
          python app/cli/dispatch.py --help > /dev/null
          BEADS_DIR="$RUNNER_TEMP/board/.beads" python app/cli/dispatch.py prime > /dev/null
          python -c "import runpy; [runpy.run_path(f'app/cli/{f}', run_name='ci') for f in ('serve.py','presence.py','notify.py','updater.py','edit-guard.py')]"
      - name: Every CLI module ships in the app bundle
        run: cd app/cli && python -m unittest -q test_bundle

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci
      - run: cd app && npx tsc --noEmit
      - run: cd app && npm test
      - run: cd app && npx vite build
