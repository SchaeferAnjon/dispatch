[package]
name = "dispatch"
version = "0.7.14"
description = "Dispatch 调度台 — 所有 Agent 共用的任务板（Beads 前端）"
authors = ["Schaefer"]
edition = "2021"

[lib]
name = "dispatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
dirs = "6"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSString", "NSRange", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSStringDrawing", "NSImage", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSFont", "NSFontDescriptor", "NSColor", "objc2-core-foundation"] }
